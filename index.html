            cardDark: '#182130',

          fontFamily: {

            mono: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'glow-green': '0 0 20px rgba(0, 255, 102, 0.35)',
            'glow-amber': '0 0 20px rgba(255, 176, 0, 0.35)',
            'glow-cyan': '0 0 20px rgba(0, 229, 255, 0.35)',
          }
        }
      }
    }
  </script>

  <style>
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }

      animation: pulse-glow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

      transition: stroke-dashoffset 0.8s ease-in-out, stroke 0.3s ease;

</head>
<body class="bg-brandDark text-slate-100 font-sans antialiased min-h-[100dvh] flex flex-col justify-between p-3 sm:p-4 pb-[calc(2.5rem+env(safe-area-inset-bottom))] select-none overflow-y-auto">

  <!-- TOP HEADER / APP BAR -->
  <header class="flex-shrink-0 flex items-center justify-between px-3 py-2 bg-panelDark border border-borderDark rounded-xl shadow-lg mb-2">
    <div class="flex items-center gap-2">
      <div id="statusDot" class="w-3.5 h-3.5 rounded-full bg-neonGreen shadow-[0_0_8px_#00FF66]"></div>
      <h1 class="font-extrabold text-lg sm:text-xl tracking-tight text-white">STEAK<span class="text-neonCyan">PULSE</span></h1>
    </div>
    
    <div class="flex items-center gap-2">
      <span id="phaseBadge" class="text-xs font-black px-2.5 py-1 rounded-md bg-amber-500/20 text-neonAmber border border-neonAmber/40 uppercase tracking-widest tabular-nums">
        READY
      </span>
      <button id="soundToggleBtn" onclick="toggleMute()" class="flex items-center gap-1.5 px-3 py-1 bg-cardDark hover:bg-slate-700 active:scale-95 transition border border-borderDark rounded-lg text-xs font-black text-slate-300">
        <svg id="soundIcon" class="w-4 h-4 text-neonCyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
        </svg>
        <span id="soundText" class="hidden sm:inline">BEEP</span>

    </div>
  </header>

  <!-- MAIN KITCHEN DASHBOARD -->
  <main class="flex-1 flex flex-col gap-2 max-w-xl mx-auto w-full">
    
    <!-- STEAK SELECTOR SECTION -->
    <section class="flex-shrink-0 bg-panelDark border border-borderDark rounded-xl p-2.5 sm:p-3 shadow-lg">
      
      <!-- CUT & THICKNESS ROW -->
      <div class="grid grid-cols-2 gap-2 mb-2 items-end">
        <!-- STEAK CUT -->
        <div class="flex flex-col">
          <label class="text-[11px] font-black uppercase tracking-wider text-slate-400 mb-1">Steak Cut</label>
          <div class="relative w-full h-11">
            <select id="steakCut" onchange="onSteakConfigChange()" class="w-full h-11 bg-cardDark text-white font-extrabold text-sm sm:text-base border border-borderDark rounded-lg px-2.5 py-0 appearance-none focus:outline-none focus:border-neonCyan text-ellipsis overflow-hidden box-border leading-none">
              <option value="ribeye">Ribeye</option>
              <option value="sirloin">Top Sirloin</option>
              <option value="ny_strip">New York Strip</option>
              <option value="filet">Filet Mignon</option>
              <option value="flat_iron">Flat Iron</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>
        </div>

        <!-- THICKNESS -->
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-black uppercase tracking-wider text-slate-400">Thickness</label>
            <div class="flex bg-cardDark border border-borderDark rounded-lg p-0.5">
              <button id="unitInBtn" onclick="setUnit('in')" class="px-2.5 py-0.5 text-[11px] font-black rounded-md transition bg-neonAmber text-brandDark">IN</button>
              <button id="unitCmBtn" onclick="setUnit('cm')" class="px-2.5 py-0.5 text-[11px] font-black rounded-md transition text-slate-400 hover:text-white">CM</button>
            </div>
          </div>
          <div class="flex items-center bg-cardDark border border-borderDark rounded-lg px-2 py-0 h-11 box-border">
            <input type="number" id="thicknessInput" value="1.0" step="0.25" min="0.5" max="3.0" onchange="onSteakConfigChange()" oninput="onSteakConfigChange()" class="w-full h-full bg-transparent font-extrabold text-base sm:text-lg text-white text-center focus:outline-none tabular-nums">
            <span id="unitLabel" class="text-xs font-black text-neonCyan uppercase ml-1">in</span>

      <!-- DONENESS SELECTOR -->
      <div class="mb-2">
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px] font-black uppercase tracking-wider text-slate-400">Doneness</label>
          <span class="text-[10px] font-extrabold text-neonAmber flex items-center gap-1">

          <button onclick="selectDoneness('medium_rare')" id="btn-medium_rare" class="doneness-btn relative py-1.5 rounded-lg font-extrabold text-xs border border-borderDark bg-cardDark text-slate-300 hover:border-slate-500 transition">M-Rare</button>
          <button onclick="selectDoneness('medium')" id="btn-medium" class="doneness-btn relative py-1.5 rounded-lg font-extrabold text-xs border border-borderDark bg-cardDark text-slate-300 hover:border-slate-500 transition">Medium</button>
          <button onclick="selectDoneness('medium_well')" id="btn-medium_well" class="doneness-btn relative py-1.5 rounded-lg font-extrabold text-xs border border-borderDark bg-cardDark text-slate-300 hover:border-slate-500 transition">M-Well</button>
          <button onclick="selectDoneness('well')" id="btn-well" class="doneness-btn relative py-1.5 rounded-lg font-extrabold text-xs border border-borderDark bg-cardDark text-slate-300 hover:border-slate-500 transition">Well</button>
        </div>
      </div>

      <!-- CHEF REASON EXPLANATION -->
      <div class="bg-cardDark/80 border border-borderDark/60 rounded-lg p-2 text-xs text-slate-300 font-medium flex items-center gap-2">
        <p id="chefReasonText" class="text-[11px] sm:text-xs text-slate-300 leading-snug font-semibold">Medium for Ribeye renders rich fat for maximum flavor.</p>
      </div>
    </section>

    <!-- TARGET ADJUSTMENT ROW -->
    <section class="flex-shrink-0 grid grid-cols-2 gap-2">
      <!-- COOK TARGET -->
      <div class="bg-panelDark border border-borderDark rounded-xl p-2 flex items-center justify-between">
        <div>
          <div class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Cook Target</div>
          <div class="flex items-baseline">
            <span id="cookTargetMins" class="font-black text-xl text-neonCyan tabular-nums">5</span>
            <span class="text-xs font-black text-neonCyan ml-0.5">m</span>
          </div>
        </div>
        <div class="flex gap-1">
          <button onclick="adjustTarget('cook', -1)" class="w-7 h-7 rounded-lg bg-cardDark border border-borderDark flex items-center justify-center font-black text-base text-white active:scale-90 transition hover:bg-slate-700">-</button>
          <button onclick="adjustTarget('cook', 1)" class="w-7 h-7 rounded-lg bg-cardDark border border-borderDark flex items-center justify-center font-black text-base text-white active:scale-90 transition hover:bg-slate-700">+</button>
        </div>
      </div>

      <!-- REST TARGET -->
      <div class="bg-panelDark border border-borderDark rounded-xl p-2 flex items-center justify-between">
        <div>
          <div class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Rest Target</div>
          <div class="flex items-baseline">
            <span id="restTargetMins" class="font-black text-xl text-neonAmber tabular-nums">4</span>
            <span class="text-xs font-black text-neonAmber ml-0.5">m</span>
          </div>
        </div>
        <div class="flex gap-1">
          <button onclick="adjustTarget('rest', -1)" class="w-7 h-7 rounded-lg bg-cardDark border border-borderDark flex items-center justify-center font-black text-base text-white active:scale-90 transition hover:bg-slate-700">-</button>
          <button onclick="adjustTarget('rest', 1)" class="w-7 h-7 rounded-lg bg-cardDark border border-borderDark flex items-center justify-center font-black text-base text-white active:scale-90 transition hover:bg-slate-700">+</button>
        </div>
      </div>
    </section>
<!-- CIRCULAR COUNTDOWN & NUMBER DISPLAY -->
    <section class="bg-panelDark border border-borderDark rounded-xl p-3 shadow-xl grid grid-cols-2 gap-3 items-center relative overflow-hidden">
      
      <!-- LEFT: CIRCULAR GAUGE (Half size horizontally of its container) -->
      <div class="relative flex items-center justify-center w-full">
<svg class="w-full h-auto aspect-square" viewBox="0 0 240 240">
  <circle
    cx="120"
    cy="120"
    r="104"
    stroke="#182130"
    style="stroke-width: 14px;"
    fill="transparent"
  />
  <circle
    id="progressRing"
    class="progress-ring-circle"
    cx="120"
    cy="120"
    r="104"
    stroke="#00FF66"
    style="stroke-width: 14px;"
    stroke-linecap="round"
    fill="transparent"

    stroke-dashoffset="0"
  />
</svg>

        <div class="absolute inset-0 flex items-center justify-center">
          <span id="centerSteakIcon" class="text-2xl sm:text-3xl drop-shadow-[0_0_10px_rgba(0,255,102,0.6)] transition-all duration-300 select-none">🥩</span>
        </div>
      </div>

<!-- RIGHT: LARGER NUMBER COUNTDOWN & LABELS -->
      <div class="flex flex-col items-start justify-center">
        <!-- Added explicit inline style to force exact matching size -->
        <span id="ringLabelText" class="font-black uppercase tracking-widest text-neonCyan mb-1 flex items-center gap-1 text-xl" style="font-size: 1.25rem;">
          NEXT FLIP IN
        </span>
        <div class="flex items-baseline">
          <span id="countdownNumber" class="font-extrabold text-neonGreen tracking-tight drop-shadow-[0_0_16px_rgba(0,255,102,0.5)] tabular-nums leading-none text-9xl sm:text-[10rem]">
            60
          </span>
        </div>
        <span id="countdownUnitText" class="font-black tracking-widest text-slate-400 uppercase text-xl mt-1" style="font-size: 1.25rem;">
          SECONDS
        </span>
      </div>

    </section>

    <!-- FLIP TRACKER & TOTAL ELAPSED -->
    <section class="flex-shrink-0 bg-panelDark border border-borderDark rounded-xl p-2.5 shadow-xl flex flex-col justify-between">
      
      <div class="text-[11px] font-black uppercase tracking-widest text-neonGreen mb-1.5 flex justify-between items-center">
        <span>FLIP TRACKER</span>
        <span id="elapsedHeaderLabel" class="text-[10px] text-slate-400 font-extrabold flex items-center gap-1">
          <span id="elapsedBlinkDot" class="w-2 h-2 rounded-full bg-slate-600"></span> TOTAL ELAPSED
        </span>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-2">
        <div class="bg-cardDark border-2 border-neonGreen/80 rounded-lg p-2 flex flex-col items-center justify-center shadow-[0_0_10px_rgba(0,255,102,0.15)]">
          <div id="flipCounterText" class="font-black text-sm text-neonGreen tracking-tight text-center tabular-nums">
            FLIP 1 OF 5
          </div>
          <div id="sideIndicator" class="text-[10px] font-extrabold text-neonCyan tracking-wider uppercase text-center mt-0.5">
            SIDE A COOKING
          </div>
        </div>

        <div class="bg-cardDark border border-borderDark rounded-lg p-2 flex flex-col items-center justify-center">
          <div class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider mb-0.5">ELAPSED / TOTAL</div>
          <div class="font-black text-lg text-white tracking-wider flex items-baseline gap-1 tabular-nums">
            <span id="totalElapsedDigits">00:00</span>
            <span class="text-xs text-slate-400 font-semibold">/ <span id="totalTargetDigits">05:00</span></span>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="w-full bg-slate-950 rounded-full h-3.5 p-0.5 border border-slate-700/80 overflow-hidden shadow-inner">
          <div id="progressBarFill" class="bg-gradient-to-r from-emerald-500 to-neonGreen h-full rounded-full transition-all duration-300 w-0 shadow-[0_0_12px_#00FF66]"></div>
        </div>

        <div class="flex justify-between items-center text-xs font-black tabular-nums">
          <span id="progressPercentText" class="px-2 py-0.5 bg-cardDark/80 border border-borderDark rounded text-neonCyan text-[11px]">0%</span>
          <span id="timeRemainingText" class="px-2 py-0.5 bg-cardDark/80 border border-borderDark rounded text-neonAmber text-[11px]">05:00 LEFT</span>
        </div>
      </div>

    </section>

  </main>

  <!-- PRIMARY KITCHEN ACTION CONTROLS -->
  <footer class="flex-shrink-0 grid grid-cols-3 gap-2 mt-2 max-w-xl mx-auto w-full">
    <button id="startPauseBtn" onclick="toggleTimer()" class="col-span-2 py-3 px-4 rounded-xl font-black text-base bg-neonGreen text-brandDark hover:bg-emerald-400 active:scale-95 transition shadow-glow-green flex items-center justify-center gap-2">
      <svg id="startPauseIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="startPauseLabel">START COOK</span>
    </button>

    <button id="resetBtn" onclick="resetTimer()" class="py-3 px-3 rounded-xl font-black text-sm bg-cardDark hover:bg-slate-700 text-slate-200 border border-borderDark active:scale-95 transition flex items-center justify-center">
      RESET
    </button>
  </footer>

  <script>
    /* --------------------------------------------------
     * STATE MANAGEMENT & CONFIGURATION
     * -------------------------------------------------- */
    let currentUnit = 'in';
    let selectedCut = 'ribeye';
    let selectedDoneness = 'medium';

    let cookTargetMins = 5;
    let restTargetMins = 4;

    let timerState = 'STOPPED';
    let timerInterval = null;

    let cookElapsedSec = 0;
    let restElapsedSec = 0;
    let flipCountdownSec = 60;

    let soundMuted = false;

    const CIRCLE_RADIUS = 52;
    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

    const steakRecommendations = {
      ribeye: { recDoneness: 'medium', reason: 'Medium for Ribeye renders rich fat for maximum flavor.' },
      filet: { recDoneness: 'medium_rare', reason: 'Medium-Rare for Filet Mignon preserves extreme tenderness without drying.' },
      sirloin: { recDoneness: 'medium', reason: 'Medium for Top Sirloin softens fibers and crisps side fat strip.' },
      ny_strip: { recDoneness: 'medium_rare', reason: 'Medium-Rare for New York Strip balances marbling and tight beef grain.' },
      flat_iron: { recDoneness: 'medium_rare', reason: 'Medium-Rare for Flat Iron highlights juicy tenderness equal to filet.' }
    };

    const donenessBaseTimePerInch = {
      rare: 3.5,
      medium_rare: 4.25,
      medium: 5.0,
      medium_well: 6.0,
      well: 7.5
    };

    /* --------------------------------------------------
     * AUDIO SYNTHESIS
     * -------------------------------------------------- */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(type = 'flip') {
      if (soundMuted) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'flip') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'phase_end') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        osc.frequency.setValueAtTime(783.99, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else if (type === 'tick') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    function toggleMute() {
      soundMuted = !soundMuted;
      const btn = document.getElementById('soundToggleBtn');
      const icon = document.getElementById('soundIcon');
      
      if (soundMuted) {
        btn.classList.add('opacity-50');
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15L4 13.414V9h4l5-4v6.586l4.293 4.293a1 1 0 01-1.414 1.414L5.586 15z M17 14l2 2m0-4l-2 2"/>`;
      } else {
        btn.classList.remove('opacity-50');
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>`;
        playBeep('tick');
      }
    }

    /* --------------------------------------------------
     * INITIALIZATION & SELECTION LOGIC
     * -------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      onSteakConfigChange();
      updateUI();
    });

    function setUnit(unit) {
      if (currentUnit === unit) return;
      const input = document.getElementById('thicknessInput');
      let val = parseFloat(input.value) || 1.0;

      if (unit === 'cm') {
        val = (val * 2.54).toFixed(1);
        input.min = "1.0"; input.max = "8.0"; input.step = "0.5";
        document.getElementById('unitLabel').innerText = 'cm';
        document.getElementById('unitCmBtn').className = 'px-2.5 py-0.5 text-[11px] font-black rounded-md transition bg-neonAmber text-brandDark';
        document.getElementById('unitInBtn').className = 'px-2.5 py-0.5 text-[11px] font-black rounded-md transition text-slate-400 hover:text-white';
      } else {
        val = (val / 2.54).toFixed(1);
        input.min = "0.5"; input.max = "3.0"; input.step = "0.25";
        document.getElementById('unitLabel').innerText = 'in';
        document.getElementById('unitInBtn').className = 'px-2.5 py-0.5 text-[11px] font-black rounded-md transition bg-neonAmber text-brandDark';
        document.getElementById('unitCmBtn').className = 'px-2.5 py-0.5 text-[11px] font-black rounded-md transition text-slate-400 hover:text-white';
      }

      currentUnit = unit;
      input.value = val;
      onSteakConfigChange();
    }

    function selectDoneness(doneness) {
      selectedDoneness = doneness;
      calculateTimes();
      renderDonenessButtons();
    }

    function onSteakConfigChange() {
      selectedCut = document.getElementById('steakCut').value;
      const rec = steakRecommendations[selectedCut];

      if (rec) {
        selectedDoneness = rec.recDoneness;
        document.getElementById('chefReasonText').innerText = rec.reason;
      }

      calculateTimes();
      renderDonenessButtons();
    }

    function renderDonenessButtons() {
      const rec = steakRecommendations[selectedCut];
      const buttons = ['rare', 'medium_rare', 'medium', 'medium_well', 'well'];

      buttons.forEach(d => {
        const btn = document.getElementById(`btn-${d}`);
        const isSelected = selectedDoneness === d;
        const isRec = rec && rec.recDoneness === d;

        let classes = 'doneness-btn relative py-1.5 rounded-lg font-extrabold text-xs transition flex items-center justify-center ';
        if (isSelected) {
          classes += 'bg-neonAmber text-brandDark border-2 border-amber-300 font-black shadow-glow-amber ';
        } else {
          classes += 'bg-cardDark text-slate-300 border border-borderDark hover:border-slate-500 ';
        }

        btn.className = classes;
        const dotHTML = isRec ? `<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-neonAmber rounded-full border border-brandDark shadow-[0_0_6px_#FFB000]"></span>` : '';
        
        let label = d.replace('_', '-');
        if (d === 'rare') label = 'Rare';
        if (d === 'medium_rare') label = 'M-Rare';
        if (d === 'medium') label = 'Medium';
        if (d === 'medium_well') label = 'M-Well';
        if (d === 'well') label = 'Well';

        btn.innerHTML = `${label} ${dotHTML}`;
      });
    }

    function calculateTimes() {
      if (timerState !== 'STOPPED') return;

      const thicknessVal = parseFloat(document.getElementById('thicknessInput').value) || 1.0;
      let thicknessInInches = currentUnit === 'cm' ? thicknessVal / 2.54 : thicknessVal;

      const basePerInch = donenessBaseTimePerInch[selectedDoneness] || 4.5;
      
      let rawCookMins = Math.round(basePerInch * thicknessInInches);
      cookTargetMins = Math.max(2, Math.min(20, rawCookMins));
      restTargetMins = Math.max(3, Math.round(cookTargetMins * 0.8));

      updateUI();
    }

    function adjustTarget(type, delta) {
      if (timerState !== 'STOPPED') return;
      if (type === 'cook') {
        cookTargetMins = Math.max(1, Math.min(30, cookTargetMins + delta));
      } else if (type === 'rest') {
        restTargetMins = Math.max(1, Math.min(20, restTargetMins + delta));
      }
      updateUI();
    }

    /* --------------------------------------------------
     * TIMER CONTROLLER ENGINE
     * -------------------------------------------------- */
    function toggleTimer() {
      initAudio();

      if (timerState === 'STOPPED') {
        timerState = 'COOKING';
        cookElapsedSec = 0;
        flipCountdownSec = 60;
        startInterval();
      } else if (timerState === 'COOKING') {
        timerState = 'PAUSED_COOK';
        clearInterval(timerInterval);
      } else if (timerState === 'PAUSED_COOK') {
        timerState = 'COOKING';
        startInterval();
      } else if (timerState === 'RESTING') {
        timerState = 'PAUSED_REST';
        clearInterval(timerInterval);
      } else if (timerState === 'PAUSED_REST') {
        timerState = 'RESTING';
        startInterval();
      }

      updateUI();
    }

    function startInterval() {
      clearInterval(timerInterval);
      timerInterval = setInterval(tick, 1000);
    }

    function tick() {
      const totalCookSec = cookTargetMins * 60;
      const totalRestSec = restTargetMins * 60;

      if (timerState === 'COOKING') {
        cookElapsedSec++;
        flipCountdownSec--;

        if (flipCountdownSec <= 3 && flipCountdownSec > 0) {
          playBeep('tick');
        }

        if (flipCountdownSec <= 0) {
          playBeep('flip');
          flipCountdownSec = 60;
        }

        if (cookElapsedSec >= totalCookSec) {
          playBeep('phase_end');
          timerState = 'RESTING';
          restElapsedSec = 0;
          flipCountdownSec = 0;
        }
      } else if (timerState === 'RESTING') {
        restElapsedSec++;

        if (restElapsedSec >= totalRestSec) {
          playBeep('phase_end');
          clearInterval(timerInterval);
          timerState = 'STOPPED';
          alert('🥩 STEAK IS PERFECTLY COOKED & RESTED! READY TO SERVE!');
          resetTimer();
          return;
        }
      }

      updateUI();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerState = 'STOPPED';
      cookElapsedSec = 0;
      restElapsedSec = 0;
      flipCountdownSec = 60;

      calculateTimes();
      updateUI();
    }

    /* --------------------------------------------------
     * CIRCULAR GAUGE & UI RENDERER
     * -------------------------------------------------- */
    function setGaugeValue(currentVal, maxVal, colorHex, glowColor) {
      const ring = document.getElementById('progressRing');
      const numDisplay = document.getElementById('countdownNumber');
      const steakIcon = document.getElementById('centerSteakIcon');

      numDisplay.innerText = currentVal < 10 && currentVal >= 0 ? `0${currentVal}` : `${currentVal}`;
      numDisplay.style.color = colorHex;
      numDisplay.style.filter = `drop-shadow(0 0 16px ${glowColor})`;

      if (steakIcon) {
        steakIcon.style.filter = `drop-shadow(0 0 10px ${glowColor})`;
      }

      const fraction = Math.max(0, Math.min(1, currentVal / maxVal));
      const offset = CIRCLE_CIRCUMFERENCE * (1 - fraction);

      ring.style.strokeDashoffset = offset;
      ring.style.stroke = colorHex;
      ring.style.filter = `drop-shadow(0 0 8px ${glowColor})`;
    }

    function updateUI() {
      const totalCookSec = cookTargetMins * 60;
      const totalRestSec = restTargetMins * 60;

      document.getElementById('cookTargetMins').innerText = cookTargetMins;
      document.getElementById('restTargetMins').innerText = restTargetMins;

      const phaseBadge = document.getElementById('phaseBadge');
      const startPauseBtn = document.getElementById('startPauseBtn');
      const startPauseLabel = document.getElementById('startPauseLabel');
      const startPauseIcon = document.getElementById('startPauseIcon');
      const statusDot = document.getElementById('statusDot');
      const elapsedBlinkDot = document.getElementById('elapsedBlinkDot');
      const ringLabelText = document.getElementById('ringLabelText');
      const countdownUnitText = document.getElementById('countdownUnitText');

      if (timerState === 'STOPPED') {
        phaseBadge.innerText = 'READY';
        phaseBadge.className = 'text-xs font-black px-2.5 py-1 rounded-md bg-amber-500/20 text-neonAmber border border-neonAmber/40 uppercase tracking-widest tabular-nums';
        startPauseBtn.className = 'col-span-2 py-3 px-4 rounded-xl font-black text-base bg-neonGreen text-brandDark hover:bg-emerald-400 active:scale-95 transition shadow-glow-green flex items-center justify-center gap-2';
        startPauseLabel.innerText = 'START COOK';
        startPauseIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        statusDot.className = 'w-3.5 h-3.5 rounded-full bg-neonGreen shadow-[0_0_8px_#00FF66]';
        elapsedBlinkDot.className = 'w-2 h-2 rounded-full bg-slate-600';
        ringLabelText.innerText = 'NEXT FLIP IN';
        ringLabelText.className = 'text-[11px] sm:text-xs font-black uppercase tracking-widest text-neonCyan mb-0.5 flex items-center gap-1';
        countdownUnitText.innerText = 'SECONDS';
        
        setGaugeValue(60, 60, '#00FF66', 'rgba(0, 255, 102, 0.4)');
      } 
      else if (timerState === 'COOKING') {
        phaseBadge.innerText = 'COOKING';
        phaseBadge.className = 'text-xs font-black px-2.5 py-1 rounded-md bg-emerald-500/20 text-neonGreen border border-neonGreen/40 uppercase tracking-widest tabular-nums';
        startPauseBtn.className = 'col-span-2 py-3 px-4 rounded-xl font-black text-base bg-neonAmber text-brandDark hover:bg-amber-400 active:scale-95 transition shadow-glow-amber flex items-center justify-center gap-2';
        startPauseLabel.innerText = 'PAUSE';
        startPauseIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        statusDot.className = 'w-3.5 h-3.5 rounded-full bg-neonGreen animate-pulse-glow shadow-[0_0_12px_#00FF66]';
        elapsedBlinkDot.className = 'w-2 h-2 rounded-full bg-neonAmber animate-pulse-glow shadow-[0_0_6px_#FFB000]';
        ringLabelText.innerText = 'NEXT FLIP IN';
        ringLabelText.className = 'text-[11px] sm:text-xs font-black uppercase tracking-widest text-neonCyan mb-0.5 flex items-center gap-1';
        countdownUnitText.innerText = 'SECONDS';

        setGaugeValue(flipCountdownSec, 60, '#00FF66', 'rgba(0, 255, 102, 0.4)');
      } 
      else if (timerState === 'PAUSED_COOK' || timerState === 'PAUSED_REST') {
        phaseBadge.innerText = 'PAUSED';
        phaseBadge.className = 'text-xs font-black px-2.5 py-1 rounded-md bg-slate-700 text-slate-300 border border-slate-500 uppercase tracking-widest tabular-nums';
        startPauseBtn.className = 'col-span-2 py-3 px-4 rounded-xl font-black text-base bg-neonGreen text-brandDark hover:bg-emerald-400 active:scale-95 transition shadow-glow-green flex items-center justify-center gap-2';
        startPauseLabel.innerText = 'RESUME';
        startPauseIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        statusDot.className = 'w-3.5 h-3.5 rounded-full bg-slate-500';
        elapsedBlinkDot.className = 'w-2 h-2 rounded-full bg-slate-600';
      }
      else if (timerState === 'RESTING') {
        phaseBadge.innerText = 'RESTING';
        phaseBadge.className = 'text-xs font-black px-2.5 py-1 rounded-md bg-cyan-500/20 text-neonCyan border border-neonCyan/40 uppercase tracking-widest tabular-nums';
        startPauseBtn.className = 'col-span-2 py-3 px-4 rounded-xl font-black text-base bg-neonAmber text-brandDark hover:bg-amber-400 active:scale-95 transition shadow-glow-amber flex items-center justify-center gap-2';
        startPauseLabel.innerText = 'PAUSE REST';
        startPauseIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        statusDot.className = 'w-3.5 h-3.5 rounded-full bg-neonCyan animate-pulse-glow shadow-[0_0_12px_#00E5FF]';
        elapsedBlinkDot.className = 'w-2 h-2 rounded-full bg-neonCyan animate-pulse-glow shadow-[0_0_6px_#00E5FF]';
        ringLabelText.innerText = 'REST REMAINING';
        ringLabelText.className = 'text-[11px] sm:text-xs font-black uppercase tracking-widest text-neonAmber mb-0.5 flex items-center gap-1';
        countdownUnitText.innerText = 'SECONDS';

        const currentRestVal = Math.max(0, totalRestSec - restElapsedSec);
        setGaugeValue(currentRestVal, totalRestSec, '#00E5FF', 'rgba(0, 229, 255, 0.4)');
      }

      const flipCounterText = document.getElementById('flipCounterText');
      const sideIndicator = document.getElementById('sideIndicator');
      const totalElapsedDigits = document.getElementById('totalElapsedDigits');
      const totalTargetDigits = document.getElementById('totalTargetDigits');
      const progressBarFill = document.getElementById('progressBarFill');
      const progressPercentText = document.getElementById('progressPercentText');
      const timeRemainingText = document.getElementById('timeRemainingText');

      if (timerState === 'RESTING' || timerState === 'PAUSED_REST') {
        flipCounterText.innerText = "RESTING STEAK";
        flipCounterText.className = "font-black text-sm text-neonCyan tracking-tight text-center tabular-nums";
        sideIndicator.innerText = "DO NOT CUT YET";
        sideIndicator.className = "text-[10px] font-extrabold text-neonAmber tracking-wider uppercase text-center mt-0.5";

        totalElapsedDigits.innerText = formatMMSS(restElapsedSec);
        totalTargetDigits.innerText = formatMMSS(totalRestSec);

        const percent = Math.min(100, Math.round((restElapsedSec / totalRestSec) * 100));
        progressBarFill.style.width = `${percent}%`;
        progressBarFill.className = "bg-gradient-to-r from-cyan-500 to-neonCyan h-full rounded-full transition-all duration-300 shadow-[0_0_12px_#00E5FF]";
        progressPercentText.innerText = `${percent}%`;

        const remSec = Math.max(0, totalRestSec - restElapsedSec);
        timeRemainingText.innerText = `${formatMMSS(remSec)} LEFT`;
      } else {
        const currentFlip = Math.floor(cookElapsedSec / 60) + 1;
        const totalFlips = cookTargetMins;
        flipCounterText.innerText = `FLIP ${Math.min(currentFlip, totalFlips)} OF ${totalFlips}`;
        flipCounterText.className = "font-black text-sm text-neonGreen tracking-tight text-center tabular-nums";

        const isSideA = currentFlip % 2 !== 0;
        sideIndicator.innerText = isSideA ? "SIDE A COOKING" : "SIDE B COOKING";
        sideIndicator.className = "text-[10px] font-extrabold text-neonCyan tracking-wider uppercase text-center mt-0.5";

        totalElapsedDigits.innerText = formatMMSS(cookElapsedSec);
        totalTargetDigits.innerText = formatMMSS(totalCookSec);

        const percent = Math.min(100, Math.round((cookElapsedSec / totalCookSec) * 100));
        progressBarFill.style.width = `${percent}%`;
        progressBarFill.className = "bg-gradient-to-r from-emerald-500 to-neonGreen h-full rounded-full transition-all duration-300 shadow-[0_0_12px_#00FF66]";
        progressPercentText.innerText = `${percent}%`;

        const remSec = Math.max(0, totalCookSec - cookElapsedSec);
        timeRemainingText.innerText = `${formatMMSS(remSec)} LEFT`;
      }
    }

    function formatMMSS(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      const mm = m < 10 ? `0${m}` : m;
      const ss = s < 10 ? `0${s}` : s;
      return `${mm}:${ss}`;
    }
  </script>
